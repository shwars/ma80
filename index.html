<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="80 лет — одна большая история в фотографиях." />
    <title>Мама — 80 лет</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&amp;family=Prata&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="data/photos.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main id="app">
      <section class="cover" id="cover" aria-labelledby="cover-title">
        <div class="cover__photos" aria-hidden="true">
          <div class="cover__print cover__print--one"></div>
          <div class="cover__print cover__print--two"></div>
          <div class="cover__print cover__print--three"></div>
        </div>
        <div class="cover__content">
          <p class="cover__lead">80 лет — одна большая история</p>
          <h1 id="cover-title">Мама</h1>
          <p class="cover__copy">Через десятилетия семейной истории.</p>
          <button class="start-button" id="start-button" type="button">
            Смотреть фотографии
            <span aria-hidden="true">→</span>
          </button>
        </div>
      </section>

      <section class="album" id="album" aria-label="Фотоальбом" hidden>
        <div class="ambient" id="ambient" aria-hidden="true"></div>
        <header class="album__topbar chrome">
          <button class="wordmark" id="restart-button" type="button" aria-label="Вернуться к началу">
            Мама · 80
          </button>
          <div class="topbar__actions">
            <span class="counter" id="counter" aria-live="polite"></span>
            <button class="icon-button" id="fullscreen-button" type="button" aria-label="Открыть на весь экран">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
              </svg>
            </button>
          </div>
        </header>

        <div class="deck" id="deck" aria-live="polite"></div>

        <button class="nav-button nav-button--previous chrome" id="previous-button" type="button" aria-label="Предыдущая фотография">
          <span aria-hidden="true">←</span>
        </button>
        <button class="nav-button nav-button--next chrome" id="next-button" type="button" aria-label="Следующая фотография">
          <span aria-hidden="true">→</span>
        </button>

        <footer class="album__footer chrome">
          <div class="caption">
            <p class="caption__age" id="age-label"></p>
            <p class="caption__detail" id="detail-label"></p>
          </div>
          <label class="timeline" for="timeline">
            <span class="sr-only">Перейти к фотографии</span>
            <input id="timeline" type="range" min="0" value="0" step="1" />
            <span class="timeline__ends" aria-hidden="true"><span id="timeline-start"></span><span id="timeline-end"></span></span>
          </label>
        </footer>

        <div class="gesture-hint" id="gesture-hint" role="status">
          <span aria-hidden="true">←</span> листайте <span aria-hidden="true">→</span>
        </div>
      </section>

      <noscript>Для просмотра альбома необходимо включить JavaScript.</noscript>
    </main>
  </body>
</html>
